name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Build and inspect wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          unzip -l dist/*.whl | grep -q "musubi/templates/project/dot-env.example.tmpl"
          unzip -l dist/*.whl | grep -q "musubi/templates/project/dot-gitignore.tmpl"
      - name: Render and validate profiles
        run: |
          for profile in dev stage prod; do
            musubi init "demo-$profile" --profile "$profile" --output "/tmp/demo-$profile"
            musubi validate "/tmp/demo-$profile"
          done
      - name: Validate static site
        run: test -s site/index.html && test -s site/styles.css && test -s site/assets/musubi-mark.svg && test -s site/assets/favicon.svg && test -s site/assets/favicon-32.png && test -s site/assets/apple-touch-icon.png && test -s site/assets/social-cover-light.png

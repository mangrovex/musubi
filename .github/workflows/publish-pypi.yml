name: Publish Musubi 0.2.0 to PyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the verified release to production PyPI
        type: boolean
        default: false

permissions: {}

concurrency:
  group: pypi-musubi-0.2.0

jobs:
  prepare:
    if: github.repository == 'mangrovex/musubi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify the GitHub release distributions
        run: |
          mkdir dist
          base_url=https://github.com/mangrovex/musubi/releases/download/v0.2.0
          cd dist
          curl -fsSLO --retry 3 "$base_url/musubi_framework-0.2.0-py3-none-any.whl"
          curl -fsSLO --retry 3 "$base_url/musubi_framework-0.2.0.tar.gz"
          sha256sum --check <<'CHECKSUMS'
          3f37264ed0b6192f2c164d9d53ee14ee0a88fed815540415750001d7ab464b31  musubi_framework-0.2.0-py3-none-any.whl
          0c3d7df4436b8ee9ae108e8d22869aa8e2c35a56c35bca51110b815a270ed722  musubi_framework-0.2.0.tar.gz
          CHECKSUMS
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check distributions and smoke-test the release wheel
        run: |
          python -m pip --isolated install --index-url https://pypi.org/simple twine
          python -m twine check --strict dist/*
          python -m venv "$RUNNER_TEMP/musubi-release"
          export PATH="$RUNNER_TEMP/musubi-release/bin:$PATH"
          python -m pip install --no-index dist/*.whl
          test "$(musubi --version)" = 'musubi 0.2.0'
          musubi profiles
          for profile in dev stage prod; do
            target="$RUNNER_TEMP/musubi-$profile"
            musubi init "musubi-$profile" --profile "$profile" --output "$target"
            musubi validate "$target"
            test -f "$target/.gitignore"
          done
          musubi init rabbit-test --profile prod --rabbitmq --output "$RUNNER_TEMP/musubi-rabbit"
          test -f "$RUNNER_TEMP/musubi-rabbit/rabbitmq/harden-amqp.py"
          test -f "$RUNNER_TEMP/musubi-rabbit/rabbitmq/amqp-enmasse.yaml"
      - uses: actions/upload-artifact@v4
        with:
          name: musubi-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/musubi-framework/0.2.0/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: musubi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the exact version from public PyPI and exercise the CLI
        run: |
          python -m venv "$RUNNER_TEMP/musubi-pypi"
          export PATH="$RUNNER_TEMP/musubi-pypi/bin:$PATH"
          export PIP_CONFIG_FILE=/dev/null
          for attempt in 1 2 3 4 5 6; do
            if python -m pip --isolated install --no-cache-dir --index-url https://pypi.org/simple musubi-framework==0.2.0; then
              break
            fi
            test "$attempt" -lt 6
            sleep 10
          done
          test "$(musubi --version)" = 'musubi 0.2.0'
          musubi profiles
          for profile in dev stage prod; do
            target="$RUNNER_TEMP/musubi-$profile"
            musubi init "musubi-$profile" --profile "$profile" --output "$target"
            musubi validate "$target"
            test -f "$target/.gitignore"
          done
          musubi init rabbit-test --profile prod --rabbitmq --output "$RUNNER_TEMP/musubi-rabbit"
          test -f "$RUNNER_TEMP/musubi-rabbit/rabbitmq/harden-amqp.py"
          test -f "$RUNNER_TEMP/musubi-rabbit/rabbitmq/amqp-enmasse.yaml"
          musubi doctor "$RUNNER_TEMP/musubi-dev"

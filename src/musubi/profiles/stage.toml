description = "Preproducción semejante a producción y TLS automático"
environment = "Staging"
default_domain = "stage.example.com"
zato_image = "zatosource/zato-4.1:latest"
zato_port = 17010
caddy_http_port = 80
caddy_https_port = 443
replicas = 1
log_level = "INFO"
tls_mode = "{$CADDY_EMAIL}"
audit_log = true
